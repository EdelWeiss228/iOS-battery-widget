name: BatteryWidget
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # Change this one value to your own reverse-DNS prefix. Keep it unique:
    # it is used for bundle IDs, the App Group, the Keychain access group and
    # the shared Keychain service namespace.
    BUNDLE_ID_PREFIX: com.example

packages: {}

targets:

  # ── iOS App ──────────────────────────────────────────────
  BatteryWidgetApp:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
      - path: Shared
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        BatteryAppGroup: "group.$(BUNDLE_ID_PREFIX).batterywidget"
        BatteryServicePrefix: "$(BUNDLE_ID_PREFIX).batterywidget"
        UIBackgroundModes: [fetch, network-authentication, bluetooth-central]
        UILaunchStoryboardName: ""
        BatteryKeychainAccessGroup: "$(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).batterywidget.shared"
        NSLocalNetworkUsageDescription: "Для синхронизации заряда с Mac через локальную сеть"
        NSBonjourServices: ["_batterysync._tcp"]
        NSBluetoothAlwaysUsageDescription: "Чтобы показывать заряд подключённых наушников и часов"
        UIApplicationSceneManifest:
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).batterywidget
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: iOSApp/BatteryWidgetApp.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(BUNDLE_ID_PREFIX).batterywidget"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).batterywidget.shared"]
    dependencies:
      - target: BatteryWidgetExtension

  # ── iOS Widget Extension ──────────────────────────────────
  BatteryWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: iOSWidget
      - path: Shared
    info:
      path: iOSWidget/Info.plist
      properties:
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        BatteryAppGroup: "group.$(BUNDLE_ID_PREFIX).batterywidget"
        BatteryServicePrefix: "$(BUNDLE_ID_PREFIX).batterywidget"
        BatteryKeychainAccessGroup: "$(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).batterywidget.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).batterywidget.widget
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: iOSWidget/BatteryWidget.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(BUNDLE_ID_PREFIX).batterywidget"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).batterywidget.shared"]

  # ── macOS App ─────────────────────────────────────────────
  BatteryMacApp:
    type: application
    platform: macOS
    sources:
      - path: macOSApp
      - path: Shared
    info:
      path: macOSApp/Info.plist
      properties:
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        BatteryAppGroup: "group.$(BUNDLE_ID_PREFIX).batterywidget"
        BatteryServicePrefix: "$(BUNDLE_ID_PREFIX).batterywidget"
        BatteryKeychainAccessGroup: "$(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).batterywidget.shared"
        NSBluetoothAlwaysUsageDescription: "Чтобы показывать заряд наушников и часов, подключённых к Mac"
        NSLocalNetworkUsageDescription: "Для синхронизации заряда с iPhone через локальную сеть"
        NSBonjourServices: ["_batterysync._tcp"]
        LSUIElement: true       # Нет иконки в Dock
        LSBackgroundOnly: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).batterywidget.mac
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: macOSApp/BatteryMac.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups: ["group.$(BUNDLE_ID_PREFIX).batterywidget"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).batterywidget.shared"]
    dependencies:
      - target: MacBatteryWidgetExtension

  # ── macOS Widget Extension ────────────────────────────────
  MacBatteryWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: macOSWidget
      - path: Shared
    info:
      path: macOSWidget/Info.plist
      properties:
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        BatteryAppGroup: "group.$(BUNDLE_ID_PREFIX).batterywidget"
        BatteryServicePrefix: "$(BUNDLE_ID_PREFIX).batterywidget"
        BatteryKeychainAccessGroup: "$(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).batterywidget.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).batterywidget.mac.widget
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: macOSWidget/MacBatteryWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: ["group.$(BUNDLE_ID_PREFIX).batterywidget"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).batterywidget.shared"]
